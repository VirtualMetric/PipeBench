[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   map to guest = never
   server min protocol = SMB3
   smb ports = 445
   disable netbios = yes
   log level = 1
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # A client's flush reaches the server's disk before the server answers it
   strict sync = yes
   sync always = no

[share]
   path = /share
   read only = no
   browseable = yes
   valid users = bench
   force user = root
   create mask = 0660
   directory mask = 0770
