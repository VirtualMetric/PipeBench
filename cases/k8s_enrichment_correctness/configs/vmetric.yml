devices:
  - id: 1
    name: tcp-bench
    type: tcp
    properties:
      address: "0.0.0.0"
      port: 9000

targets:
  - name: tcp-target-bench
    type: tcp
    properties:
      address: "receiver"
      port: 9001

routes:
  - name: tcp-to-tcp-bench
    devices:
      - name: tcp-bench
    pipelines:
      - name: k8s-enrich
    targets:
      - name: tcp-target-bench

pipelines:
  - name: k8s-enrich
    processors:
      # tcp device delivers the raw line in `message`; promote it to root
      # fields so container_id/ns/pod_hint are addressable.
      - json:
          field: message
          add_to_root: true
          ignore_missing: true
          ignore_failure: true
      - kubernetes:
          container_id_field: container_id
          namespace_field: ns
          pod_name_field: pod_hint
          target_prefix: k8s
          # "k8s-mock" is the endpoints: entry's compose service name /
          # network alias (case.yaml) — the mock's cert SAN matches it.
          api_server: "https://k8s-mock:6443"
          # The kubernetes processor unconditionally reads the file at
          # ca_path to build its trust pool, and unconditionally reads the
          # file at token_path on every request — neither is "skip if
          # unset": token_path defaults to the in-cluster service-account
          # path (which doesn't exist in this container) and would fail
          # every request if left unset here. Both files are shipped in
          # this case's configs/certs/ and mounted read-only at
          # /opt/vmetric/certs (PipeBench's case-certs mount for the
          # "vmetric" subject). ca.pem is the mock's own self-signed leaf
          # cert (self-signed == its own issuer, so the leaf doubles as
          # the CA the client must trust). token's content is never
          # checked by the mock — it only needs to exist and be readable.
          ca_path: "/opt/vmetric/certs/ca.pem"
          token_path: "/opt/vmetric/certs/token"
          ignore_missing: true
          ignore_failure: true
