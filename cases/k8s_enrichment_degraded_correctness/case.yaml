name: k8s_enrichment_degraded_correctness
type: correctness
description: "Proves the kubernetes processor degrades gracefully when its API server is unreachable: with ignore_missing/ignore_failure set, a watcher that never completes its first LIST (sync never succeeds) must not drop, corrupt, or block events — every line passes through unenriched, zero loss. api_server points at a syntactically-valid https URL with no listener behind it (the kubernetes processor's watcher rejects non-https URLs outright at construction, so the target must still be a well-formed https:// address — just one nothing answers)."

duration: 45s
warmup: 10s

generator:
  mode: tcp
  target: "subject:9000"
  rate: 200
  format: raw
  sample_file: input/pods.log

receiver:
  mode: tcp
  listen: ":9001"

subjects:
  - vmetric

correctness:
  validate_json: true
  expected_loss_pct: 0.0
  # Every authored input line carries this literal marker value verbatim;
  # since enrichment never succeeds (no k8s.* fields ever get added — the
  # watcher never syncs), the passthrough record must still contain it
  # unchanged. Bare value token, no embedded `"` — the harness's compose
  # renderer interpolates this raw inside a double-quoted YAML string with
  # no escaping (see internal/orchestrator/docker.go), so a substring
  # containing literal double quotes corrupts the generated compose file.
  required_substring: 'k8s-degraded-bench'

configurations:
  default:
    description: "TCP in, kubernetes processor against an unreachable api_server (ignore_missing), TCP out"
