@version: 4.2

# Add one string field using a native rewrite, then serialize to JSON.
# Measures field assignment plus JSON serialization and TCP delivery.
source s_tcp {
    network(
        ip("0.0.0.0")
        transport("tcp")
        port(9000)
        max-connections(500)
        log-iw-size(500000)
        log-fetch-limit(1000)
        flags(no-parse)
    );
};

rewrite r_set {
    set("axosyslog-pipeline", value("processed_by"));
};

destination d_tcp {
    network(
        "receiver"
        transport("tcp")
        port(9001)
        template("$(format-json --scope none --key processed_by message=${MESSAGE})\n")
    );
};

log {
    source(s_tcp);
    rewrite(r_set);
    destination(d_tcp);
    flags(flow-control);
};
