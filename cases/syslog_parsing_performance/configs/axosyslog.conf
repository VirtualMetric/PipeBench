@version: 4.2

source s_tcp {
    network(
        ip("0.0.0.0")
        transport("tcp")
        port(9000)
        max-connections(500)
        log-iw-size(500000)
        log-fetch-limit(1000)
        flags(syslog-protocol)
    );
};

destination d_tcp {
    network(
        "receiver"
        transport("tcp")
        port(9001)
        template("$(format-json --scope rfc5424 --exclude DATE timestamp=${S_ISODATE})\n")
    );
};

log {
    source(s_tcp);
    destination(d_tcp);
    flags(flow-control);
};
