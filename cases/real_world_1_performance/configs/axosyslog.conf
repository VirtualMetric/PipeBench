@version: 4.2

source s_tcp {
    network(
        ip("0.0.0.0")
        transport("tcp")
        port(9000)
        max-connections(500)
        log-iw-size(500000)
        log-fetch-limit(1000)
        flags(syslog-protocol)
    );
};

# Tag debug records with `dropped = "true"` instead of filtering
# them out. Dropping records would skew the receiver's EPS
# measurement.
filter f_debug {
    level(debug);
};

rewrite r_mark_dropped {
    set(boolean("true"), value("dropped"));
};

destination d_tcp {
    network(
        "receiver"
        transport("tcp")
        port(9001)
        template("$(format-json --scope rfc5424 --key dropped --exclude DATE timestamp=${S_ISODATE})\n")
    );
};

log {
    source(s_tcp);

    if (filter(f_debug)) {
        rewrite(r_mark_dropped);
    };

    destination(d_tcp);
    flags(flow-control);
};
